<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickfigure test</title>
<style>
  :root {
    --bg: #fdfbf6;
    --ink: #232b35;
    --terracotta: #a84e2c;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
  }
  .stage {
    background: #fff;
    border: 1px dashed #ccc;
  }
  svg { display: block; }
  p { font-size: 0.85rem; color: #666; }
  .row { display: flex; gap: 3rem; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 0.85rem; color: #666; margin-top: 0.5rem; }

  .interactive-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  .interactive-section h2 { font-size: 1rem; margin: 0; }
  .interactive-section .hint { font-size: 0.8rem; color: #666; margin: 0; }
  #interactive-status {
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--ink);
    margin: 0;
  }
  .mobile-note { display: none; font-size: 0.9rem; color: #666; max-width: 320px; text-align: center; }

  @media (max-width: 640px) {
    .interactive-section { display: none; }
    .mobile-note { display: block; }
  }
</style>
</head>
<body>

<div class="row">

<figure>
<div class="stage">
  <svg id="figure-idle" viewBox="0 0 140 140" width="280" height="280" xmlns="http://www.w3.org/2000/svg"
       stroke="var(--terracotta)" stroke-width="3" stroke-linecap="round" fill="none">

    <!-- Hoofd -->
    <circle cx="60" cy="30" r="10" />

    <!-- Romp -->
    <line x1="60" y1="40" x2="60" y2="78" />

    <!-- Linkerbeen -->

      <line x1="60" y1="78" x2="58" y2="98" />

        <line x1="58" y1="98" x2="56" y2="118" />

        <line x1="62" y1="98" x2="64" y2="118" />

</div>

      <g class="leg-upper-left" transform="rotate(-10 60 78)">
        <animateTransform attributeName="transform" type="rotate"
          values="-10 60 78;-22 60 78;-50 60 78;-22 60 78;-10 60 78"
          keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />

        </g>
      </g>

    </g>
  </svg>
</div>

</figure>

<p>Testpagina voor het wandelfiguurtje — losstaand van index.html.</p>

<script>
(function () {
  function byId(id) { return document.getElementById(id); }

  var limbAnims = {
    walk: [
      'int-torso-walk',
      'int-leg-upper-left-walk', 'int-leg-lower-left-walk',
      'int-leg-upper-right-walk', 'int-leg-lower-right-walk',
      'int-arm-upper-left-walk', 'int-arm-lower-left-walk',
      'int-arm-upper-right-walk', 'int-arm-lower-right-walk'
    ],
    'jump-idle': [
      'int-root-jumpidle',
      'int-leg-upper-left-jumpidle', 'int-leg-lower-left-jumpidle',
      'int-leg-upper-right-jumpidle', 'int-leg-lower-right-jumpidle',
      'int-arm-upper-left-jumpidle', 'int-arm-lower-left-jumpidle',
      'int-arm-upper-right-jumpidle', 'int-arm-lower-right-jumpidle'
    ],
    'jump-walk': [
      'int-root-jumpwalk', 'int-torso-jumpwalk',
      'int-leg-upper-left-jumpwalk', 'int-leg-lower-left-jumpwalk',
      'int-leg-upper-right-jumpwalk', 'int-leg-lower-right-jumpwalk',
      'int-arm-upper-left-jumpwalk', 'int-arm-lower-left-jumpwalk',
      'int-arm-upper-right-jumpwalk', 'int-arm-lower-right-jumpwalk'
    ]
  };

  var JUMP_IDLE_DUR = 1500;
  var JUMP_WALK_DUR = 1100;

  var rightPressed = false;
  var upPressed = false;
  var jumping = false;
  var continuousState = 'idle'; // 'idle' | 'walk'
  var statusEl = byId('interactive-status');

  function startAnims(names) {
    names.forEach(function (id) {
      var el = byId(id);
      if (el && el.beginElement) el.beginElement();
    });
  }
  function stopAnims(names) {
    names.forEach(function (id) {
      var el = byId(id);
      if (el && el.endElement) el.endElement();
    });
  }

  function setContinuous(state) {
    if (state === continuousState) return;
    if (continuousState === 'walk') stopAnims(limbAnims.walk);
    if (state === 'walk') startAnims(limbAnims.walk);
    continuousState = state;
    if (!jumping) updateStatus();
  }

  function updateStatus(jumpLabel) {
    if (!statusEl) return;
    if (jumpLabel) {
      statusEl.textContent = jumpLabel;
    } else {
      statusEl.textContent = continuousState === 'walk' ? 'Lopen naar rechts' : 'Stilstaand';
    }
  }

  function triggerJump() {
    if (jumping) return; // negeer, voorkomt overlappende sprongen
    jumping = true;
    var variant = rightPressed ? 'jump-walk' : 'jump-idle';
    var dur = variant === 'jump-walk' ? JUMP_WALK_DUR : JUMP_IDLE_DUR;
    if (continuousState === 'walk') stopAnims(limbAnims.walk);
    startAnims(limbAnims[variant]);
    updateStatus(variant === 'jump-walk' ? 'Sprong tijdens het lopen' : 'Sprong vanuit stilstand');
    setTimeout(function () {
      stopAnims(limbAnims[variant]);
      jumping = false;
      continuousState = 'idle';
      setContinuous(rightPressed ? 'walk' : 'idle');
      updateStatus();
    }, dur);
  }

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      if (!rightPressed) {
        rightPressed = true;
        if (!jumping) setContinuous('walk');
      }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!upPressed) {
        upPressed = true;
        triggerJump();
      }
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      // Nog geen animatie voor lopen naar links (volgt als spiegeling van rechts).
      // Toets wordt geregistreerd maar verandert de pose voorlopig niet.
    }
  });

  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowRight') {
      rightPressed = false;
      if (!jumping) setContinuous('idle');
    } else if (e.key === 'ArrowUp') {
      upPressed = false;
    }
  });
})();
</script>
