<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickfigure test</title>
<style>
  :root {
    --bg: #fdfbf6;
    --ink: #232b35;
    --terracotta: #a84e2c;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
  }
  .stage {
    background: #fff;
    border: 1px dashed #ccc;
  }
  svg { display: block; }
  p { font-size: 0.85rem; color: #666; }
  .row { display: flex; gap: 3rem; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 0.85rem; color: #666; margin-top: 0.5rem; }
</style>
</head>
<body>

<div class="row">

<figure>
<div class="stage">
  <svg id="figure-idle" viewBox="0 0 140 140" width="280" height="280" xmlns="http://www.w3.org/2000/svg"
       stroke="var(--terracotta)" stroke-width="3" stroke-linecap="round" fill="none">

    <!-- Hoofd -->
    <circle cx="60" cy="30" r="10" />

    <!-- Romp -->
    <line x1="60" y1="40" x2="60" y2="78" />

    <!-- Linkerbeen -->
    <g class="leg-upper-left" transform="rotate(-14 60 78)">
      <line x1="60" y1="78" x2="58" y2="98" />
      <g class="leg-lower-left" transform="rotate(0 58 98)">
        <line x1="58" y1="98" x2="56" y2="118" />
      </g>
    </g>

    <!-- Rechterbeen -->
    <g class="leg-upper-right" transform="rotate(14 60 78)">
      <line x1="60" y1="78" x2="62" y2="98" />
      <g class="leg-lower-right" transform="rotate(0 62 98)">
        <line x1="62" y1="98" x2="64" y2="118" />
      </g>
    </g>

    <!-- Linkerarm -->
    <g class="arm-upper-left" transform="rotate(8 60 50)">
      <line x1="60" y1="50" x2="48" y2="64" />
      <g class="arm-lower-left" transform="rotate(0 48 64)">
        <line x1="48" y1="64" x2="40" y2="80" />
      </g>
    </g>

    <!-- Rechterarm -->
    <g class="arm-upper-right" transform="rotate(-8 60 50)">
      <line x1="60" y1="50" x2="72" y2="64" />
      <g class="arm-lower-right" transform="rotate(0 72 64)">
        <line x1="72" y1="64" x2="80" y2="80" />
      </g>
    </g>

  </svg>
</div>
<figcaption>Rustpose (goedgekeurd, ongewijzigd)</figcaption>
</figure>

<figure>
<div class="stage">
  <svg id="figure-walk" viewBox="0 0 140 140" width="280" height="280" xmlns="http://www.w3.org/2000/svg"
       stroke="var(--terracotta)" stroke-width="3" stroke-linecap="round" fill="none">

    <!-- Hoofd -->
    <circle cx="60" cy="30" r="10" />

    <!-- Romp: curve i.p.v. rechte lijn -->
    <path d="M 60 78 Q 62 59 60 40">
      <animate attributeName="d"
        values="M 60 78 Q 62 59 60 40;M 60 78 Q 65 59 60 40;M 60 78 Q 62 59 60 40;M 60 78 Q 65 59 60 40;M 60 78 Q 62 59 60 40"
        keyTimes="0;0.25;0.5;0.75;1"
        dur="1.2s" repeatCount="indefinite" />
    </path>

    <!-- Linkerbeen -->
    <g class="leg-upper-left" transform="rotate(22 60 78)">
      <animateTransform attributeName="transform" type="rotate"
        values="22 60 78;0 60 78;-22 60 78;0 60 78;22 60 78"
        keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite" />
      <line x1="60" y1="78" x2="58" y2="98" />
      <g class="leg-lower-left" transform="rotate(5 58 98)">
        <animateTransform attributeName="transform" type="rotate"
          values="5 58 98;60 58 98;15 58 98;10 58 98;5 58 98"
          keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite" />
        <line x1="58" y1="98" x2="56" y2="118" />
      </g>
    </g>

    <!-- Rechterbeen -->
    <g class="leg-upper-right" transform="rotate(-22 60 78)">
      <animateTransform attributeName="transform" type="rotate"
        values="-22 60 78;0 60 78;22 60 78;0 60 78;-22 60 78"
        keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite" />
      <line x1="60" y1="78" x2="62" y2="98" />
      <g class="leg-lower-right" transform="rotate(15 62 98)">
        <animateTransform attributeName="transform" type="rotate"
          values="15 62 98;10 62 98;5 62 98;60 62 98;15 62 98"
          keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite" />
        <line x1="62" y1="98" x2="64" y2="118" />
      </g>
    </g>

    <!-- Linkerarm: elleboog dicht bij het lichaam -->
    <g class="arm-upper-left" transform="rotate(-12 60 50)">
      <animateTransform attributeName="transform" type="rotate"
        values="-12 60 50;0 60 50;12 60 50;0 60 50;-12 60 50"
        keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite" />
      <line x1="60" y1="50" x2="53" y2="66" />
      <g class="arm-lower-left" transform="rotate(-35 53 66)">
        <animateTransform attributeName="transform" type="rotate"
          values="-35 53 66;-30 53 66;-45 53 66;-70 53 66;-35 53 66"
          keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite" />
        <line x1="53" y1="66" x2="46" y2="80" />
      </g>
    </g>

    <!-- Rechterarm: elleboog dicht bij het lichaam -->
    <g class="arm-upper-right" transform="rotate(12 60 50)">
      <animateTransform attributeName="transform" type="rotate"
        values="12 60 50;0 60 50;-12 60 50;0 60 50;12 60 50"
        keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite" />
      <line x1="60" y1="50" x2="67" y2="66" />
      <g class="arm-lower-right" transform="rotate(-30 67 66)">
        <animateTransform attributeName="transform" type="rotate"
          values="-30 67 66;-45 67 66;-25 67 66;-30 67 66;-30 67 66"
          keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite" />
        <line x1="67" y1="66" x2="74" y2="80" />
      </g>
    </g>

  </svg>
</div>
<figcaption>Loopanimatie naar rechts (nieuw)</figcaption>
</figure>

<figure>
<div class="stage">
  <svg id="figure-jump" viewBox="0 -30 140 170" width="280" height="340" xmlns="http://www.w3.org/2000/svg"
       stroke="var(--terracotta)" stroke-width="3" stroke-linecap="round" fill="none">

    <g class="figure-root" transform="translate(0 0)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 5;0 -40;0 5;0 0"
        keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />

      <!-- Hoofd -->
      <circle cx="60" cy="30" r="10" />

      <!-- Romp: buigt mee naar rechts, sterker naarmate hij hoger komt -->
      <path d="M 60 78 Q 62 59 60 40">
        <animate attributeName="d"
          values="M 60 78 Q 62 59 60 40;M 60 78 Q 64 59 60 40;M 60 78 Q 66 59 60 40;M 60 78 Q 64 59 60 40;M 60 78 Q 62 59 60 40"
          keyTimes="0;0.15;0.5;0.85;1"
          dur="1.1s" repeatCount="indefinite" />
      </path>

      <!-- Voorste (rechter) been: trekt op met sterke kniebuiging -->
      <g class="leg-upper-left" transform="rotate(-10 60 78)">
        <animateTransform attributeName="transform" type="rotate"
          values="-10 60 78;-22 60 78;-50 60 78;-22 60 78;-10 60 78"
          keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />
        <line x1="60" y1="78" x2="58" y2="98" />
        <g class="leg-lower-left" transform="rotate(5 58 98)">
          <animateTransform attributeName="transform" type="rotate"
            values="5 58 98;15 58 98;55 58 98;15 58 98;5 58 98"
            keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />
          <line x1="58" y1="98" x2="56" y2="118" />
        </g>
      </g>

      <!-- Achterste (linker) been: tuckt sterk naar boven -->
      <g class="leg-upper-right" transform="rotate(10 60 78)">
        <animateTransform attributeName="transform" type="rotate"
          values="10 60 78;25 60 78;45 60 78;25 60 78;10 60 78"
          keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />
        <line x1="60" y1="78" x2="62" y2="98" />
        <g class="leg-lower-right" transform="rotate(10 62 98)">
          <animateTransform attributeName="transform" type="rotate"
            values="10 62 98;30 62 98;70 62 98;30 62 98;10 62 98"
            keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />
          <line x1="62" y1="98" x2="64" y2="118" />
        </g>
      </g>

      <!-- Linkerarm: zwaait tegengesteld mee -->
      <g class="arm-upper-left" transform="rotate(-15 60 50)">
        <animateTransform attributeName="transform" type="rotate"
          values="-15 60 50;-25 60 50;-45 60 50;-25 60 50;-15 60 50"
          keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />
        <line x1="60" y1="50" x2="53" y2="66" />
        <g class="arm-lower-left" transform="rotate(-30 53 66)">
          <animateTransform attributeName="transform" type="rotate"
            values="-30 53 66;-40 53 66;-55 53 66;-40 53 66;-30 53 66"
            keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />
          <line x1="53" y1="66" x2="46" y2="80" />
        </g>
      </g>

      <!-- Rechterarm: zwaait tegengesteld mee -->
      <g class="arm-upper-right" transform="rotate(15 60 50)">
        <animateTransform attributeName="transform" type="rotate"
          values="15 60 50;20 60 50;35 60 50;20 60 50;15 60 50"
          keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />
        <line x1="60" y1="50" x2="67" y2="66" />
        <g class="arm-lower-right" transform="rotate(-40 67 66)">
          <animateTransform attributeName="transform" type="rotate"
            values="-40 67 66;-45 67 66;-55 67 66;-45 67 66;-40 67 66"
            keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" repeatCount="indefinite" />
          <line x1="67" y1="66" x2="74" y2="80" />
        </g>
      </g>

    </g>
  </svg>
</div>
<figcaption>Sprong tijdens het lopen, naar rechts (nieuw)</figcaption>
</figure>

</div>
<p>Testpagina voor het wandelfiguurtje — losstaand van index.html.</p>

</body>
</html>
