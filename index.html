<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cranenklas aardrijkskunde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdfbf6;
    --ink: #232b35;
    --ink-soft: #4d5661;
    --terracotta: #a84e2c;
    --terracotta-dark: #7c3820;
    --wood: #6b4a34;
    --wood-dark: #4d3325;
    --line: #b3a696;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Atkinson Hyperlegible', sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 4rem;
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: inherit;
    text-decoration: none;
  }
  .logo span { color: var(--terracotta); }
  nav a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.9rem;
    margin-left: 2rem;
  }
  nav a.active {
    color: var(--ink);
    font-weight: 500;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 0;
    padding: 0 2rem;
  }
  .hero {
    text-align: center;
    max-width: 640px;
  }
  .hero h1 {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 700;
    font-size: 2.2rem;
    line-height: 1.3;
    margin: 0 0 0.75rem;
  }
  .hero p {
    color: var(--ink-soft);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 auto;
    max-width: 460px;
  }

  /* Wegwijzerbord */
  .signpost-wrap {
    position: relative;
    overflow: hidden;
    align-self: stretch;
    flex: 1;
    min-height: 0;
  }
  /* Scrollende scene-laag: bord, looppad en instructie-tekstvak zitten hier
     samen in en bewegen altijd als één geheel via translateX.
     De padding staat hier (niet op .signpost-wrap): position:absolute
     kinderen negeren de padding van hun containing block wanneer die
     geen border heeft, dus .signpost zou anders tegen de rand aan zitten. */
  .scene-content {
    position: absolute;
    inset: 0;
    padding: 1rem 0 2.75rem;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }
  .signpost {
    position: relative;
    width: 60px;
    height: 100%;
    max-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .post {
    width: 22px;
    height: 100%;
    background: var(--wood);
    border-radius: 2px;
    position: relative;
    z-index: 1;
  }
  .post::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 16px;
    background: var(--wood-dark);
    border-radius: 50%;
    opacity: 0.3;
    z-index: -1;
  }
  .plank {
    position: absolute;
    left: 50%;
    display: flex;
    align-items: center;
    height: 46px;
    padding: 0 22px;
    background: var(--terracotta);
    color: #f5ede2;
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    white-space: nowrap;
    text-decoration: none;
    border-radius: 3px 20px 20px 3px;
    box-shadow: 2px 3px 0 var(--terracotta-dark);
    transition: transform 0.15s ease;
    transform: var(--tf);
  }
  .plank:hover { transform: var(--tf) translateY(-3px); }
  .plank.left {
    border-radius: 20px 3px 3px 20px;
    justify-content: flex-end;
    padding-right: 24px;
  }
  .plank-1 { top: 6%; --tf: translateX(6px) rotate(-2deg); }
  .plank-1.left { --tf: translateX(calc(-100% - 6px)) rotate(2deg); }
  .plank-2 { top: 33%; --tf: translateX(6px) rotate(-1.5deg); }
  .plank-3 { top: 60%; --tf: translateX(6px) rotate(-1deg); }
  .plank-3.left { --tf: translateX(calc(-100% - 6px)) rotate(1deg); }

  /* Wandelfiguurtje ("Over mij") */
  .walk-path {
    position: absolute;
    left: 0;
    /* loopt ver door voorbij het scherm zodat het pad nooit "op" lijkt te
       raken tijdens het lopen naar rechts (nog geen grens die kant op) */
    width: 20000px;
    bottom: 2.75rem;
    height: 2px;
    background-image: repeating-linear-gradient(to right, var(--line) 0 6px, transparent 6px 12px);
  }
  .walk-figure {
    position: absolute;
    bottom: 2.75rem;
    left: calc(50% + 150px);
  }
  .walk-figure svg {
    display: block;
    width: 190px;
    height: 204px;
  }
  .controls-box {
    position: absolute;
    top: 0.5rem;
    right: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    border: 2px solid var(--terracotta);
    border-radius: 10px;
    background: transparent;
    padding: 0.7rem 1rem;
  }
  .controls-box p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--ink);
    white-space: nowrap;
  }
  .walk-path[hidden], .walk-figure[hidden], .controls-box[hidden] { display: none; }

  .footer-note {
    text-align: center;
    font-size: 0.75rem;
    color: var(--ink-soft);
    padding-bottom: 0.75rem;
    flex-shrink: 0;
  }

  @media (max-width: 640px) {
    header { padding: 1rem 1.25rem; }
    .logo { font-size: 1.15rem; }
    nav a { display: none; }
    main { padding: 0 1rem; }
    .hero h1 {
      font-size: clamp(1.9rem, 9vw, 2.5rem);
      line-height: 1.15;
      margin: 0 0 0.6rem;
    }
    .hero p { font-size: 0.95rem; }
    .signpost-wrap {
      flex: 1;
      min-height: 0;
    }
    .scene-content {
      align-items: center;
      padding: 0.5rem 0;
    }
    .signpost {
      height: 78%;
      min-height: 260px;
      max-height: 85dvh;
      width: 220px;
    }
    .post { width: 30px; }
    .plank {
      height: 80px;
      width: max-content;
      font-size: 1.3rem;
      line-height: 1.15;
      padding: 0 24px;
      white-space: normal;
      text-align: left;
      /* voorkomt dat een bord buiten het scherm valt: begrenst de breedte
         tot de ruimte die vanaf het midden tot de schermrand beschikbaar is */
      max-width: calc(50vw - 15px);
      overflow: hidden;
    }
    .plank.left { padding-right: 26px; text-align: right; }
    .plank-1 { top: 6%; }
    .plank-2 { top: 26%; }
    .plank-3 { top: 46%; }
    .footer-note { font-size: 0.8rem; }
    .walk-path, .walk-figure, .controls-box { display: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Cranenklas<span>.</span></a>
  <nav>
    <a href="#">Educatieve tools</a>
    <a href="#" class="over-mij-trigger">Over mij</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
<section class="hero">
  <h1>Aardrijkskunde<br>Welke kant wil je op?</h1>
  <p>Lesmateriaal, een kijkje in mijn onderwijspad, of meteen contact opnemen? Kies hieronder een richting.</p>
</section>

      <div class="post"></div>
    </div>

    <div class="controls-box" id="controls-box" hidden>

          <animateTransform id="wf-leg-upper-right-walkleft" attributeName="transform" type="rotate"

            <animateTransform id="card-arm-lower" attributeName="transform" type="rotate"
              begin="indefinite" repeatCount="1"
              values="0 72 64;-20 72 64;-20 72 64;0 72 64"
              keyTimes="0;0.3;0.7;1" dur="1.1s" />
            <animateTransform id="wf-arm-lower-right-walk" attributeName="transform" type="rotate"
              begin="indefinite" repeatCount="indefinite"
              values="-30 72 64;-45 72 64;-25 72 64;-30 72 64;-30 72 64"
              keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" />
            <animateTransform id="wf-arm-lower-right-walkleft" attributeName="transform" type="rotate"
              begin="indefinite" repeatCount="indefinite"
              values="20 72 64;60 72 64;15 72 64;10 72 64;20 72 64"
              keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" />
            <animateTransform id="wf-arm-lower-right-jumpidle" attributeName="transform" type="rotate"
              begin="indefinite" repeatCount="1"
              values="0 72 64;-10 72 64;40 72 64;-10 72 64;0 72 64"
              keyTimes="0;0.15;0.5;0.85;1" dur="0.75s" />
            <animateTransform id="wf-arm-lower-right-jumpwalk" attributeName="transform" type="rotate"
              begin="indefinite" repeatCount="1"
              values="-40 72 64;-45 72 64;-55 72 64;-45 72 64;-40 72 64"
              keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" />
            <animateTransform id="wf-arm-lower-right-jumpleft" attributeName="transform" type="rotate"
              begin="indefinite" repeatCount="1"
              values="40 72 64;45 72 64;55 72 64;45 72 64;40 72 64"
              keyTimes="0;0.15;0.5;0.85;1" dur="1.1s" />
            <line x1="72" y1="64" x2="80" y2="80" />
            <rect x="75" y="70" width="12" height="16" rx="1.5" fill="#f5ede2" stroke="var(--terracotta-dark)" stroke-width="1.5" stroke-linecap="round" opacity="0">
              <animate id="card-reveal" attributeName="opacity" begin="indefinite" repeatCount="1"
                values="0;1;1;0" keyTimes="0;0.3;0.7;1" dur="1.1s" />
            </rect>
          </g>
        </g>

      </g>
    </svg>
  </div>
</div>
</main>

<script>
(function () {
  var triggers = document.querySelectorAll('.over-mij-trigger');
  var walkPath = document.getElementById('walk-path');
  var walkFigure = document.getElementById('walk-figure');
  var controlsBox = document.getElementById('controls-box');
  var sceneContent = document.getElementById('scene-content');
  var revealed = false;
  var controlsReady = false; // pas actief zodra de introsequentie (pad/figuur/kaartje/tekstvak) klaar is

  var CARD_DELAY = 700;      // ms, binnen de gevraagde 0.5-1s
  var CARD_DURATION = 1100;  // ms, moet gelijk zijn aan dur van de SMIL-animaties hierboven

  function byId(id) { return document.getElementById(id); }
  function beginById(id) { var el = byId(id); if (el && el.beginElement) el.beginElement(); }

  function showScene() {
    if (revealed) return;
    if (!window.matchMedia('(min-width: 641px)').matches) return; // desktop-only
    revealed = true;

    walkPath.hidden = false;
    walkFigure.hidden = false;

    setTimeout(function () {
      beginById('card-arm-upper');
      beginById('card-arm-lower');
      beginById('card-reveal');

      setTimeout(function () {
        controlsBox.hidden = false;
        controlsReady = true;
        requestAnimationFrame(scrollLoop);
      }, CARD_DURATION);
    }, CARD_DELAY);
  }

  triggers.forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      showScene();
    });
  });

  // --- Wandelbesturing: pose van het figuurtje + scroll van de scene ---

  var limbAnims = {
    walk: [
      'wf-torso-walk',
      'wf-leg-upper-left-walk', 'wf-leg-lower-left-walk',
      'wf-leg-upper-right-walk', 'wf-leg-lower-right-walk',
      'wf-arm-upper-left-walk', 'wf-arm-lower-left-walk',
      'wf-arm-upper-right-walk', 'wf-arm-lower-right-walk'
    ],
    'walk-left': [
      'wf-torso-walkleft',
      'wf-leg-upper-left-walkleft', 'wf-leg-lower-left-walkleft',
      'wf-leg-upper-right-walkleft', 'wf-leg-lower-right-walkleft',
      'wf-arm-upper-left-walkleft', 'wf-arm-lower-left-walkleft',
      'wf-arm-upper-right-walkleft', 'wf-arm-lower-right-walkleft'
    ],
    'jump-idle': [
      'wf-root-jumpidle',
      'wf-leg-upper-left-jumpidle', 'wf-leg-lower-left-jumpidle',
      'wf-leg-upper-right-jumpidle', 'wf-leg-lower-right-jumpidle',
      'wf-arm-upper-left-jumpidle', 'wf-arm-lower-left-jumpidle',
      'wf-arm-upper-right-jumpidle', 'wf-arm-lower-right-jumpidle'
    ],
    'jump-walk': [
      'wf-root-jumpwalk', 'wf-torso-jumpwalk',
      'wf-leg-upper-left-jumpwalk', 'wf-leg-lower-left-jumpwalk',
      'wf-leg-upper-right-jumpwalk', 'wf-leg-lower-right-jumpwalk',
      'wf-arm-upper-left-jumpwalk', 'wf-arm-lower-left-jumpwalk',
      'wf-arm-upper-right-jumpwalk', 'wf-arm-lower-right-jumpwalk'
    ],
    'jump-walk-left': [
      'wf-root-jumpleft', 'wf-torso-jumpleft',
      'wf-leg-upper-left-jumpleft', 'wf-leg-lower-left-jumpleft',
      'wf-leg-upper-right-jumpleft', 'wf-leg-lower-right-jumpleft',
      'wf-arm-upper-left-jumpleft', 'wf-arm-lower-left-jumpleft',
      'wf-arm-upper-right-jumpleft', 'wf-arm-lower-right-jumpleft'
    ]
  };

  var JUMP_IDLE_DUR = 750;
  var JUMP_WALK_DUR = 1100;
  // px/s -- getuned op het ritme van de loopanimatie (dur 1.2s per pas), zie verificatie
  var SCROLL_SPEED = 50;

  var rightPressed = false;
  var leftPressed = false;
  var upPressed = false;
  var jumping = false;
  var direction = null; // null | 'right' | 'left' -- laatst ingedrukte richting, ook tijdens een sprong bijgehouden
  var continuousState = 'idle'; // 'idle' | 'walk' | 'walk-left'
  var sceneOffset = 0; // huidige translateX van .scene-content (0 = startpositie, nooit positief)
  var lastFrameTime = null;

  function startAnims(names) { names.forEach(function (id) { var el = byId(id); if (el && el.beginElement) el.beginElement(); }); }
  function stopAnims(names) { names.forEach(function (id) { var el = byId(id); if (el && el.endElement) el.endElement(); }); }

  function stopContinuous() {
    if (continuousState === 'walk') stopAnims(limbAnims.walk);
    else if (continuousState === 'walk-left') stopAnims(limbAnims['walk-left']);
  }

  function setContinuous(state) {
    if (state === continuousState) return;
    stopContinuous();
    if (state === 'walk') startAnims(limbAnims.walk);
    else if (state === 'walk-left') startAnims(limbAnims['walk-left']);
    continuousState = state;
  }

  // Past de zichtbare stand-/loopstaat aan op de huidige `direction`, maar
  // alleen als er geen sprong bezig is (die mag niet onderbroken worden).
  function applyDirection() {
    if (jumping) return;
    setContinuous(direction === 'right' ? 'walk' : direction === 'left' ? 'walk-left' : 'idle');
  }

  function triggerJump() {
    if (jumping) return; // negeer, voorkomt overlappende sprongen
    jumping = true;
    var variant = direction === 'right' ? 'jump-walk' : direction === 'left' ? 'jump-walk-left' : 'jump-idle';
    var dur = variant === 'jump-idle' ? JUMP_IDLE_DUR : JUMP_WALK_DUR;
    stopContinuous();
    startAnims(limbAnims[variant]);
    setTimeout(function () {
      stopAnims(limbAnims[variant]);
      jumping = false;
      continuousState = 'idle';
      applyDirection();
    }, dur);
  }

  // De scene (bord + pad + tekstvak) schuift als één geheel; de sprong
  // raakt hier expres niet aan -- alleen de horizontale richting telt.
  function scrollLoop(now) {
    if (lastFrameTime === null) lastFrameTime = now;
    var dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;

    if (direction === 'right') {
      sceneOffset -= SCROLL_SPEED * dt;
    } else if (direction === 'left') {
      sceneOffset = Math.min(0, sceneOffset + SCROLL_SPEED * dt); // harde grens: nooit voorbij de startpositie
    }
    sceneContent.style.transform = 'translateX(' + sceneOffset + 'px)';

    requestAnimationFrame(scrollLoop);
  }

  window.addEventListener('keydown', function (e) {
    if (!controlsReady) return;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      if (!rightPressed) {
        rightPressed = true;
        direction = 'right';
        applyDirection();
      }
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (!leftPressed) {
        leftPressed = true;
        direction = 'left';
        applyDirection();
      }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!upPressed) {
        upPressed = true;
        triggerJump();
      }
    }
  });

  window.addEventListener('keyup', function (e) {
    if (!controlsReady) return;
    if (e.key === 'ArrowRight') {
      rightPressed = false;
      direction = leftPressed ? 'left' : null;
      applyDirection();
    } else if (e.key === 'ArrowLeft') {
      leftPressed = false;
      direction = rightPressed ? 'right' : null;
      applyDirection();
    } else if (e.key === 'ArrowUp') {
      upPressed = false;
    }
  });
})();
</script>
